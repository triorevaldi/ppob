<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPOB</title><style>body{font:15px system-ui;margin:0;background:#f5f7fb;color:#182230}header{background:#111827;color:white;padding:18px 24px}nav{padding:12px;background:white}button{padding:9px 12px;margin:4px;border:1px solid #ddd;border-radius:7px;background:white;cursor:pointer}.active,.primary{background:#2563eb;color:white}.wrap{max-width:1200px;margin:auto;padding:24px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card,section{background:white;border:1px solid #e4e7ec;border-radius:12px;padding:18px;margin:12px 0}.card{min-width:180px}.muted{color:#667085}form{display:grid;grid-template-columns:2fr 80px 1.5fr 150px 2fr auto;gap:10px;align-items:end}label{font-size:12px;color:#667085}input{width:100%;padding:9px;border:1px solid #d0d5dd;border-radius:7px;box-sizing:border-box}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}.money{text-align:right}@media(max-width:800px){form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}</style><header><b>PPOB</b> <span class="muted">Workshop Manager</span></header><nav><button class="active" id="bd">Dashboard</button><button id="bi">Income Manager</button></nav><main class="wrap"><div id="dashboard"><h1>Dashboard</h1><p class="muted">Workshop income overview.</p><div class="cards"><div class="card"><div class="muted">Total Income</div><h2 id="total">Rp 0</h2></div><div class="card"><div class="muted">Transactions</div><h2 id="count">0</h2></div><div class="card"><div class="muted">Items Sold</div><h2 id="qtytotal">0</h2></div></div><section>Use <b>Income Manager</b> to record workshop income. Records are stored locally in this browser; no login is required.</section></div><div id="income" hidden><h1>Income Manager</h1><p class="muted">Record and manage workshop income.</p><section><form id="form"><div class="wide"><label>Item name</label><input id="item" required></div><div><label>Qty</label><input id="qty" type="number" min="1" value="1" required></div><div><label>Income amount (IDR)</label><input id="amount" type="number" min="0" required></div><div><label>Date</label><input id="date" readonly></div><div class="wide"><label>Note</label><input id="note"></div><button class="primary">Add income</button></form><div id="table"></div></section></div></main><script>
const K='ppob.income.v1';let data=JSON.parse(localStorage.getItem(K)||'[]'),editing=null,$=x=>document.getElementById(x),fmt=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n),today=()=>{let d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()};$('date').value=today();
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let t=data.reduce((a,r)=>a+r.amount,0),q=data.reduce((a,r)=>a+r.qty,0);$('total').textContent=fmt(t);$('count').textContent=data.length;$('qtytotal').textContent=q;if(!data.length){$('table').innerHTML='<p class="muted">No income records yet.</p>';return}$('table').innerHTML='<table><tr><th>Item name</th><th>Qty</th><th class="money">Income amount</th><th>Date</th><th>Note</th><th>Action</th></tr>'+data.map(r=>'<tr><td>'+esc(r.item)+'</td><td>'+r.qty+'</td><td class="money">'+fmt(r.amount)+'</td><td>'+r.date+'</td><td>'+esc(r.note)+'</td><td><button onclick="editRow(\''+r.id+'\')">Edit</button><button onclick="delRow(\''+r.id+'\')">Delete</button></td></tr>').join('')+'</table>'}
$('form').onsubmit=e=>{e.preventDefault();let r={item:$('item').value.trim(),qty:+$('qty').value,amount:+$('amount').value,date:$('date').value,note:$('note').value.trim()};if(editing){let i=data.findIndex(x=>x.id===editing);data[i]={...data[i],...r};editing=null;e.target.querySelector('button').textContent='Add income'}else data.push({id:crypto.randomUUID(),...r});localStorage.setItem(K,JSON.stringify(data));e.target.reset();$('qty').value=1;$('date').value=today();render()};
window.editRow=id=>{let r=data.find(x=>x.id===id);editing=id;$('item').value=r.item;$('qty').value=r.qty;$('amount').value=r.amount;$('date').value=r.date;$('note').value=r.note;$('form').querySelector('button').textContent='Save changes'};
window.delRow=id=>{if(confirm('Delete this income record?')){data=data.filter(x=>x.id!==id);localStorage.setItem(K,JSON.stringify(data));render()}};
function show(p){$('dashboard').hidden=p!=='dashboard';$('income').hidden=p!=='income';$('bd').classList.toggle('active',p==='dashboard');$('bi').classList.toggle('active',p==='income');if(p==='income')$('date').value=today()}$('bd').onclick=()=>show('dashboard');$('bi').onclick=()=>show('income');render();
</script>
