<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPOB</title><link rel="stylesheet" href="css/style.css"></head><body><header><b>PPOB</b> <span class="muted">Workshop Manager</span></header><nav><button class="active" id="bd">Dashboard</button><button id="bi">Income Manager</button></nav><main class="wrap"><div id="dashboard"><h1>Dashboard</h1><p class="muted">Workshop income overview.</p><div class="cards"><div class="card"><div class="muted">Total Income</div><h2 id="total">Rp 0</h2></div><div class="card"><div class="muted">Transactions</div><h2 id="count">0</h2></div><div class="card"><div class="muted">Items Sold</div><h2 id="qtytotal">0</h2></div></div><section>Use <b>Income Manager</b> to record workshop income. Records are stored locally in this browser; no login is required.</section></div><div id="income" hidden><h1>Income Manager</h1><p class="muted">Record and manage workshop income.</p><section><form id="form"><div class="wide"><label>Item name</label><input id="item" required></div><div><label>Qty</label><input id="qty" type="number" min="1" value="1" required></div><div><label>Income amount (IDR)</label><input id="amount" type="number" min="0" required></div><div><label>Date</label><input id="date" readonly></div><div class="wide"><label>Note</label><input id="note"></div><button class="primary">Add income</button></form><div id="table"></div></section></div></main><script src="js/app.js"></script></body></html>
