<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PPOB</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-title">PPOB</div>
      <div class="brand-subtitle">Workshop Manager</div>
    </div>
    <nav class="app-nav" aria-label="Application navigation">
      <button class="nav-item active" id="bd" title="Dashboard">
        <span class="nav-icon">⌂</span><span class="nav-label">Dashboard</span>
      </button>
      <button class="nav-item" id="bi" title="Income Manager">
        <span class="nav-icon">▤</span><span class="nav-label">Income Manager</span>
      </button>
    </nav>
    <button class="collapse-button" id="toggleSidebar" title="Collapse sidebar" aria-label="Collapse sidebar">‹</button>
  </aside>

  <div class="app-shell">
    <main class="wrap">
      <div id="dashboard">
        <h1>Dashboard</h1>
        <p class="muted">Workshop income overview.</p>
        <div class="cards">
          <div class="card"><div class="muted">Total Income</div><h2 id="total">Rp 0</h2></div>
          <div class="card"><div class="muted">Transactions</div><h2 id="count">0</h2></div>
          <div class="card"><div class="muted">Items Sold</div><h2 id="qtytotal">0</h2></div>
        </div>
        <section>
          Use <b>Income Manager</b> to record workshop income. Records are stored locally in this browser; no login is required.
        </section>
      </div>

      <div id="income" hidden>
        <h1>Income Manager</h1>
        <p class="muted">Record and manage workshop income.</p>
        <section>
          <form id="form">
            <div class="wide"><label>Item name</label><input id="item" required></div>
            <div><label>Qty</label><input id="qty" type="number" min="1" value="1" required></div>
            <div><label>Income amount (IDR)</label><input id="amount" type="number" min="0" required></div>
            <div><label>Date</label><input id="date" readonly></div>
            <div class="wide"><label>Note</label><input id="note"></div>
            <button class="primary">Add income</button>
          </form>
          <div id="table"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
